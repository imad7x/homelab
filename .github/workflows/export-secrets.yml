name: Export encrypted bundles

# Run by hand when restoring. Reassembles the BUNDLE_<STACK>_<NN> secrets into
# <stack>.tar.gz.age files and uploads them as a short-lived artifact. The bundles are
# age-encrypted before they ever reach GitHub, so the artifact is useless without the key.
on: workflow_dispatch

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Reassemble bundles
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          python3 - <<'PY'
          import base64, collections, json, os, re
          parts = collections.defaultdict(dict)
          for key, value in json.loads(os.environ['ALL_SECRETS']).items():
              m = re.fullmatch(r'BUNDLE_(.+)_(\d\d)', key)
              if m:
                  parts[m.group(1)][int(m.group(2))] = value
          os.makedirs('bundles')
          for name, chunks in sorted(parts.items()):
              blob = base64.b64decode(''.join(chunks[i] for i in sorted(chunks)))
              with open(f'bundles/{name.lower()}.tar.gz.age', 'wb') as f:
                  f.write(blob)
              print(f'{name}: {len(chunks)} chunk(s), {len(blob)} bytes')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: homelab-bundles
          path: bundles/
          retention-days: 1
