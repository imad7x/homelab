# Public landing page. Serves the static site and the collector's snapshot; the only
# other thing it does is log visitors (and the footer's email box) and turn away the
# ones on the blocklist. No directory listings, no proxying to anything but itself.
server_tokens off;

# ---------------------------------------------------------------- visitor log
# One JSON line per page request that came in through Cloudflare, which adds the
# visitor's real IP and location headers (city, coordinates and postcode need the
# zone's "Add visitor location headers" managed transform). Visits over the home network
# (port 3000 directly) and the healthcheck carry none, so they are not logged, on
# purpose. One file per month (UTC), read by ../visitors (the `visitors` command and
# the LAN dashboard on port 3011).
map $http_cf_connecting_ip $from_cloudflare {
    ""      0;
    default 1;
}
map $time_iso8601 $log_month {
    "~^(?<ym>\d{4}-\d{2})" $ym;
    default                 unknown;
}

# Device id: a random first-party cookie, so visits are counted per browser even when
# the IP changes. Issued with page loads only; $request_id is 32 random hex digits.
map $cookie_vid $vid_ok {
    "~^[0-9a-f]{32}$" 1;
    default           0;
}
map $vid_ok $vid {
    1       $cookie_vid;
    default $request_id;
}
map $vid_ok $vid_new {
    1       0;
    default 1;
}
map "$vid_ok:$uri" $vid_cookie {
    "~^0:/(index\.html)?$" "vid=$request_id; Max-Age=31536000; Path=/; Secure; HttpOnly; SameSite=Lax";
    default                "";
}

# Blocklist, written by the dashboard (IPs/ranges and device ids). The landing
# container reloads nginx when these files change (reload-on-blocklist.sh).
geo $http_cf_connecting_ip $blocked_ip {
    default 0;
    include /etc/nginx/blocklist/ips*.conf;      # a pattern, so a missing file is fine
}
map $cookie_vid $blocked_device {
    default 0;
    include /etc/nginx/blocklist/devices*.conf;  # likewise
}
map "$blocked_ip$blocked_device" $blocked {
    "00"    0;
    default 1;
}

# Which requests get a line: page loads, probes and anything from a blocked visitor;
# not the page's own assets or its once-a-minute snapshot polling.
map "$from_cloudflare:$blocked:$uri" $log_visit {
    "~^0:"                                        0;
    "~^1:1:"                                      1;
    "~^1:0:/api/"                                 0;
    "~^1:0:/icons/"                               0;
    "~^1:0:.*\.(css|js|svg|png|ico|webmanifest)$" 0;
    default                                       1;
}

log_format visit escape=json '{"t":"$time_iso8601","ip":"$http_cf_connecting_ip",'
    '"country":"$http_cf_ipcountry","city":"$http_cf_ipcity","region":"$http_cf_region",'
    '"postal":"$http_cf_postal_code","lat":"$http_cf_iplatitude","lon":"$http_cf_iplongitude",'
    '"ua":"$http_user_agent","brands":"$http_sec_ch_ua","model":"$http_sec_ch_ua_model",'
    '"platform":"$http_sec_ch_ua_platform","platform_version":"$http_sec_ch_ua_platform_version",'
    '"vid":"$vid","vid_new":"$vid_new","blocked":"$blocked","path":"$request_uri","status":"$status",'
    '"ref":"$http_referer","lang":"$http_accept_language","ray":"$http_cf_ray"}';

# The open page refreshes its snapshot once a minute, so these show how long it stayed open.
log_format ping escape=json '{"t":"$time_iso8601","ip":"$http_cf_connecting_ip","ua":"$http_user_agent",'
    '"vid":"$vid","vid_new":"$vid_new"}';

# What a visitor does on the page (sent by app.js): which app they open, which sections
# they reach, leaving and returning to the tab, theme and table toggles. Only these
# shapes are logged; anything else is answered and dropped.
map $args $event_ok {
    "~^a=(open|view|hide|show|theme|table)&t=[a-z0-9-]{1,24}$" 1;
    default                                                     0;
}
map "$from_cloudflare$event_ok" $log_event {
    "11"    1;
    default 0;
}
limit_req_zone $http_cf_connecting_ip zone=events:1m rate=60r/m;
log_format event escape=json '{"t":"$time_iso8601","ip":"$http_cf_connecting_ip","ua":"$http_user_agent",'
    '"vid":"$vid","vid_new":"$vid_new","a":"$arg_a","target":"$arg_t"}';

# The footer's "drop your email" box: same fields plus the posted body, a few tries a
# minute per visitor. nginx only logs it - see location /api/access.
limit_req_zone $http_cf_connecting_ip zone=ask:1m rate=6r/m;
log_format ask escape=json '{"t":"$time_iso8601","body":"$request_body","ip":"$http_cf_connecting_ip",'
    '"country":"$http_cf_ipcountry","city":"$http_cf_ipcity","region":"$http_cf_region",'
    '"postal":"$http_cf_postal_code","lat":"$http_cf_iplatitude","lon":"$http_cf_iplongitude",'
    '"ua":"$http_user_agent","brands":"$http_sec_ch_ua","model":"$http_sec_ch_ua_model",'
    '"platform":"$http_sec_ch_ua_platform","platform_version":"$http_sec_ch_ua_platform_version",'
    '"vid":"$vid","vid_new":"$vid_new","status":"$status"}';

# Answers the proxied email requests below. Loopback only; the published port is 8080.
server {
    listen 127.0.0.1:8081;
    access_log off;
    return 204;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    default_type text/plain;
    client_max_body_size 1k;

    # Locations that set their own access_log (/api/access) replace both of these.
    access_log /var/log/nginx/access.log main;
    access_log /var/log/visitors/visits-$log_month.jsonl visit if=$log_visit;

    if ($blocked) {
        return 403 "Not available.\n";
    }

    # Inherited by every location that does not set its own add_header.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # Chromium browsers hide the phone model and the real OS version from the user
    # agent string; ask for them (visitor log only). Critical-CH makes the browser
    # retry its first page load with them.
    add_header Accept-CH "Sec-CH-UA-Model, Sec-CH-UA-Platform-Version" always;
    add_header Critical-CH "Sec-CH-UA-Model" always;
    # Empty (so not sent) unless this is a page load from a browser without an id yet.
    add_header Set-Cookie $vid_cookie always;

    location = /api/snapshot.json {
        limit_except GET { deny all; }
        access_log /var/log/nginx/access.log main;
        access_log /var/log/visitors/pings-$log_month.jsonl ping if=$from_cloudflare;
        alias /srv/public/snapshot.json;
        default_type application/json;
        expires -1;
    }

    # "Drop your email": the body only lands in $request_body once nginx has read it,
    # which proxying to the loopback server above makes it do. Nothing else stores it.
    # The custom header stops other sites posting here (it forces a CORS preflight).
    location = /api/access {
        limit_except POST { deny all; }
        if ($http_x_requested_with != "ask") { return 403; }
        limit_req zone=ask burst=3 nodelay;
        limit_req_status 429;
        access_log /var/log/visitors/requests-$log_month.jsonl ask if=$from_cloudflare;
        proxy_pass http://127.0.0.1:8081;
        expires -1;
    }

    location = /api/e {
        limit_req zone=events burst=30 nodelay;
        limit_req_status 429;
        access_log /var/log/visitors/events-$log_month.jsonl event if=$log_event;
        expires -1;
        return 204;
    }

    # App logos. Most of these SVGs style themselves inline, which the page policy
    # forbids; an SVG shown through <img> cannot run script, so allow inline style
    # here only. (add_header here replaces the inherited set, hence the repeats.)
    location ^~ /icons/ {
        limit_except GET { deny all; }
        expires 7d;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control "public, max-age=604800" always;
    }

    location ~ /\. {
        return 404;
    }

    # index.html asks for these as ?v=<content hash>, so a change always fetches the
    # new file even though Cloudflare stretches browser caching to hours.
    location ~* \.(css|js|svg)$ {
        limit_except GET { deny all; }
        expires 1h;
    }

    location / {
        limit_except GET { deny all; }
        try_files $uri $uri/ =404;
        expires 5m;
    }
}
