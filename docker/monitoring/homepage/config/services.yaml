---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/services
#
# PUBLIC start page: served to the internet at the bare domain through the
# Cloudflare tunnel with no login in front of it. Keep it to plain links:
#   - only tunnel hostnames, never a 192.168.0.10 address (a siteMonitor URL is
#     sent to the browser too);
#   - no `widget:` (anyone can call /api/services/proxy and get the widget's
#     data - the Radarr/Sonarr ones return the whole library);
#   - no `server:`/`container:` (/api/docker/stats lists every container).
# The full dashboard with widgets and LAN links is homepage-lan on port 3010.

