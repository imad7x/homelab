- Infrastructure:
    # Container updater (/docker/updater). Home-only: it is deliberately kept
    # off the tunnel, so both the link and the widget use the LAN IP.
    # Checks run once a day, so a 5-minute refresh (the unit is ms) is plenty.
    - Updates:
        icon: mdi-package-up
        href: http://192.168.0.10:8084
        description: Container Updates · Checks Daily
        server: my-docker
        container: updater
        widget:
          type: customapi
          url: http://192.168.0.10:8084/api/summary
          refreshInterval: 300000
          mappings:
            - field: available
              label: Available
              format: number
            - field: last_check
              label: Checked
              format: relativeDate

    - Pi-hole:
        icon: pi-hole.png
        href: https://pihole.[[private:DOMAIN]]/admin
        description: DNS & Ad Blocking
        server: my-docker
        container: pihole

    - Cloudflare Tunnel:
        icon: cloudflare-zero-trust.png
        href: https://one.dash.cloudflare.com
        description: Public Ingress
        server: my-docker
        container: cloudflared_tunnel

    - Cloudflared DoH:
        icon: cloudflare.png
        description: DNS-over-HTTPS Resolver
        server: my-docker
        container: cloudflared

    - Homepage:
        icon: homepage.png
        href: http://192.168.0.10:3000
        description: This Dashboard
        server: my-docker
        container: homepage

