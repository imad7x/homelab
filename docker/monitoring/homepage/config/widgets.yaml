---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/info-widgets/
#
# Public page: no `resources` widget (host CPU, RAM, network and disk usage
# would be readable by anyone). Those stay on homepage-lan (port 3010).

# Filter services as you type, or search the web with the same box.
- search:
    provider: duckduckgo
    focus: false
    target: _blank

- datetime:
    text_size: xl
    format:
      dateStyle: medium
      timeStyle: short
      hour12: false
