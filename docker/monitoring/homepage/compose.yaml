services:
  # PUBLIC start page: the tunnel serves it at the bare domain with no login in
  # front, so it holds links to tunnel hostnames only (see config/services.yaml).
  # The full dashboard - widgets, Docker stats, disk usage, LAN links - is
  # ../homepage-lan on port 3010, which is not routed through the tunnel.
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    ports:
      - 3000:3000
    volumes:
      # Read-only: nothing on this page needs to write its config, and logs go to
      # stdout (LOG_TARGETS below) instead of config/logs.
      - ./config:/app/config:ro
      # settings.yaml's background is /images/bg.jpg; Homepage serves /images/
      # from public/images, not from config/.
      - ./config/images:/app/public/images:ro
      # No /var/run/docker.sock (root-equivalent on the host) and no /data: this
      # page shows no container status or disk usage.
    environment:
      - TZ=Asia/Kolkata
      # Only these Host headers are served: the tunnel hostname and the LAN address.
      - HOMEPAGE_ALLOWED_HOSTS=[[private:DOMAIN]],192.168.0.10:3000
      - LOG_TARGETS=stdout
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
