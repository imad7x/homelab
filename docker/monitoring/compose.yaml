services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.153.0
    container_name: victoriametrics
    restart: unless-stopped
    cpu_shares: 256
    ports:
      - 127.0.0.1:8428:8428
    extra_hosts:
      - "dockerlab:host-gateway"
    command:
      - '-storageDataPath=/storage'
      - '-retentionPeriod=90d'
      - '-storage.minFreeDiskSpaceBytes=5GB'
      - '-promscrape.config=/etc/victoriametrics/scrape.yml'
    volumes:
      - ./victoriametrics:/etc/victoriametrics:ro
      - monitoring_victoriametrics_data:/storage

  # Recording rules (homelab-power.yml). VictoriaMetrics does not evaluate
  # rules itself; vmalert reads them, queries VM, and writes results back.
  vmalert:
    image: victoriametrics/vmalert:v1.153.0
    container_name: vmalert
    restart: unless-stopped
    command:
      - '-datasource.url=http://victoriametrics:8428'
      - '-remoteWrite.url=http://victoriametrics:8428'
      - '-remoteRead.url=http://victoriametrics:8428'
      - '-rule=/etc/vmalert/rules/*.yml'
      - '-evaluationInterval=15s'
    volumes:
      - ./victoriametrics/rules:/etc/vmalert/rules:ro

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - 3001:3000
    restart: unless-stopped
    volumes:
      - ./grafana:/etc/grafana/provisioning/datasources
      # Dashboard provisioning. Kept as its own mount on purpose: the line above
      # lands ./grafana/provisioning/* one level too deep to be read by Grafana,
      # and re-pointing it would re-provision the Prometheus datasource and change
      # its UID, breaking the panels on the existing dashboards.
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - monitoring_grafana_data:/var/lib/grafana
      # Pi-hole Weekly dashboard: digest.db written by pihole-digest/pihole_digest.py
      - ./pihole-digest:/var/lib/pihole-digest:ro
      # Health & Training dashboard: health.db written by the gym app (/docker/gym/app/analysis.py)
      - /docker/gym/state/grafana:/var/lib/gym:ro
      # AI Usage dashboard: ledger.db snapshot written by the lab AI gateway (/docker/lab-ai)
      - /docker/lab-ai/state/grafana:/var/lib/lab-ai:ro
    # The Finance dashboard reads Firefly's database (finance-db, which is only
    # reachable on the finance stack's network) as the read-only grafana_ro.
    env_file:
      - ./grafana-finance.env
      - ./grafana-jellystat.env   # Media Usage dashboard: Jellystat DB read-only login
      - ./grafana-media.env       # Media Usage dashboard: Seerr/Radarr/Sonarr API keys
    environment:
      # Infinity: JSON API datasource used by Media Usage (Seerr requests, Radarr/Sonarr history)
      # SQLite: reads the Pi-hole weekly digest (pihole-digest/digest.db) and the gym app's health.db
      - GF_PLUGINS_PREINSTALL_SYNC=yesoreyeram-infinity-datasource,frser-sqlite-datasource
    networks:
      - default
      - finance
      - jellyfin   # reaches jellystat-db

  # Host metrics. Runs as root only so the rapl collector can read the CPU's
  # energy counters (/sys/class/powercap/intel-rapl:*/energy_uj is 0400 root
  # since the 2020 PLATYPUS fix); those give the measured CPU and RAM watts on
  # the Power panels. All host mounts stay read-only.
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    network_mode: host      # Prometheus scrapes 192.168.0.10:9100
    user: root
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)'
      - '--collector.hwmon'
      - '--collector.thermal_zone'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1  # Do not use 'latest'
    container_name: cadvisor
    # CPU saving: sample every 60s (default is 1s-2s per container), docker containers only,
    # and skip the costly per-cpu / disk-usage / diskIO metrics (dashboards use network only).
    command:
      - --housekeeping_interval=60s
      - --max_housekeeping_interval=60s
      - --allow_dynamic_housekeeping=false
      - --docker_only=true
      - --store_container_labels=false
      - --disable_metrics=percpu,disk,diskIO,referenced_memory,cpu_topology,resctrl,udp,advtcp,sched,hugetlb,memory_numa,tcp,process
    ports:
      - 8082:8080
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    privileged: true
    restart: unless-stopped

  # S.M.A.R.T. web UI + historical trends (own InfluxDB, bundled in the omnibus image).
  scrutiny:
    image: ghcr.io/analogj/scrutiny:v0.9.4-omnibus
    container_name: scrutiny
    ports:
      - 8083:8080
    restart: unless-stopped
    cap_add:
      - SYS_RAWIO   # ATA/SCSI passthrough
      - SYS_ADMIN   # required for NVMe
    devices:
      - /dev/sda
      - /dev/sdb
      - /dev/nvme0
      - /dev/nvme0n1
    environment:
      COLLECTOR_CRON_SCHEDULE: "0 */6 * * *"   # collect SMART every 6 hours
    volumes:
      - /run/udev:/run/udev:ro
      - ./scrutiny/config:/opt/scrutiny/config
      - ./scrutiny/influxdb:/opt/scrutiny/influxdb

  # Same SMART data as Prometheus metrics, for the Grafana dashboard.
  # Device types are pinned here for the same reason as in scrutiny/config/collector.yaml.
  smartctl-exporter:
    image: quay.io/prometheuscommunity/smartctl-exporter:v0.14.0
    container_name: smartctl-exporter
    user: root          # image defaults to a non-root user, which cannot open the devices
    ports:
      - 9633:9633
    restart: unless-stopped
    cap_add:
      - SYS_RAWIO
      - SYS_ADMIN
    devices:
      - /dev/sda
      - /dev/sdb
      - /dev/nvme0
      - /dev/nvme0n1
    volumes:
      - /run/udev:/run/udev:ro
    command:
      - '--smartctl.device=/dev/sda;scsi'
      - '--smartctl.device=/dev/sdb;sat'
      - '--smartctl.device=/dev/nvme0;nvme'
      - '--smartctl.interval=360m'            # re-read SMART every 6 hours
      - '--smartctl.powermode-check=standby'   # never spin a sleeping disk up just to poll it

networks:
  finance:
    name: finance_default
    external: true
  jellyfin:
    name: jellyfin_default
    external: true

volumes:
  monitoring_victoriametrics_data:
  monitoring_grafana_data:
    external: true
