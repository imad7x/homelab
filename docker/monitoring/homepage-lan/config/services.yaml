---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/services
#
# LAN start page (homepage-lan, port 3010). Every link is a 192.168.0.10 address
# and nothing here is routed through the tunnel, so this copy keeps the widgets
# (API keys), Docker stats and site monitors. The public start page is
# /docker/landing (a snapshot page, no widgets).
#
# Every tile with `server: my-docker` + `container:` shows a live running/stopped
# dot and CPU/RAM usage (see docker.yaml).

- Media:
    - Jellyfin:
        icon: jellyfin.png
        href: http://192.168.0.10:8096
        description: Media Server
        server: my-docker
        container: jellyfin
        siteMonitor: http://192.168.0.10:8096
        # WIDGET DISABLED - Jellyfin 12.0 removed the legacy /emby/ route prefix
        # and ?api_key= query auth. homepage v1.13.2 hardcodes
        # "emby/Sessions?api_key={key}", so this 404'd every refresh and spammed
        # the logs. The API key below is still VALID (header auth works); the
        # gap is upstream - both fixes (PR #7138, #7150) were closed unmerged,
        # so no homepage release fixes it yet. Re-enable when one lands.
        # widget:
        #   type: jellyfin
        #   url: http://192.168.0.10:8096
        #   key: [[secret:SEERR_APIKEY_2]]
        #   enableBlocks: true
        #   enableNowPlaying: true
        #   enableUser: true
        #   enableMediaControl: true
        #   showEpisodeNumber: true
        #   expandOneStreamToTwoRows: false

    - Jellyseerr:
        icon: jellyseerr.png
        href: http://192.168.0.10:5055
        description: Request Management
        server: my-docker
        container: jellyseerr

    - Jellystat:
        icon: jellystat.png
        href: http://192.168.0.10:3003
        description: Jellyfin watch history & stats
        server: my-docker
        container: jellystat

    - Movies:
        icon: mdi-movie-open-star-outline
        href: http://192.168.0.10:8089
        description: What to watch next, by IMDb rating
        server: my-docker
        container: movies
        siteMonitor: http://192.168.0.10:8089/api/ping

    - Navidrome:
        icon: navidrome.png
        href: http://192.168.0.10:4533
        description: Music Server
        server: my-docker
        container: navidrome
        widget:
          type: navidrome
          url: http://192.168.0.10:4533
          user: imad7x
          salt: [[secret:HOMEPAGE_SALT]]
          token: [[secret:HOMEPAGE_TOKEN]]

- Smart Home:
    - Home Assistant:
        icon: home-assistant.png
        href: http://192.168.0.10:8123
        description: Home Automation
        server: my-docker
        container: homeassistant
        siteMonitor: http://192.168.0.10:8123

- Arr:
    - Sonarr:
        icon: sonarr.png
        href: http://192.168.0.10:8989
        description: TV Shows
        server: my-docker
        container: sonarr
        siteMonitor: http://192.168.0.10:8989
        widget:
          type: sonarr
          url: http://192.168.0.10:8989
          key: [[secret:HOMEPAGE_KEY]]

    - Radarr:
        icon: radarr.png
        href: http://192.168.0.10:7878
        description: Movies
        server: my-docker
        container: radarr
        widget:
          type: radarr
          url: http://192.168.0.10:7878
          key: [[secret:HOMEPAGE_KEY_2]]

    - Bazarr:
        icon: bazarr.png
        href: http://192.168.0.10:6767
        description: Subtitles
        server: my-docker
        container: bazarr
        widget:
          type: bazarr
          url: http://192.168.0.10:6767
          key: [[secret:HOMEPAGE_KEY_3]]

- Downloads:
    - qBittorrent:
        icon: qbittorrent.png
        href: http://192.168.0.10:8080
        description: Torrent Client
        server: my-docker
        container: qbittorrent
        widget:
          type: qbittorrent
          url: http://192.168.0.10:8080
          username: imad7x
          password: [[secret:HOMEPAGE_PASSWORD]]

    - Prowlarr:
        icon: prowlarr.png
        href: http://192.168.0.10:9696
        description: Index Manager
        server: my-docker
        container: prowlarr
        widget:
          type: prowlarr
          url: http://192.168.0.10:9696
          key: [[secret:HOMEPAGE_KEY_4]]

    - Soulseek:
        icon: slskd.png
        href: http://192.168.0.10:5030
        description: P2P File Sharing
        server: my-docker
        container: slskd

    - FlareSolverr:
        icon: flaresolverr.png
        href: http://192.168.0.10:8191
        description: Cloudflare Solver
        server: my-docker
        container: flaresolverr

- Infrastructure:
    # Container updater (/docker/updater). Home-only: it is deliberately kept
    # off the tunnel. Checks run once a day, so a 5-minute refresh (the unit
    # is ms) is plenty.
    - Updates:
        icon: mdi-package-up
        href: http://192.168.0.10:8084
        description: Container Updates · Checks Daily
        server: my-docker
        container: updater
        widget:
          type: customapi
          url: http://192.168.0.10:8084/api/summary
          refreshInterval: 300000
          mappings:
            - field: available
              label: Available
              format: number
            - field: last_check
              label: Checked
              format: relativeDate

    - Pi-hole:
        icon: pi-hole.png
        href: http://192.168.0.10:8081/admin
        description: DNS & Ad Blocking
        server: my-docker
        container: pihole

    - Cloudflare Tunnel:
        icon: cloudflare-zero-trust.png
        href: https://one.dash.cloudflare.com
        description: Public Ingress
        server: my-docker
        container: cloudflared_tunnel

    - Cloudflared DoH:
        icon: cloudflare.png
        description: DNS-over-HTTPS Resolver
        server: my-docker
        container: cloudflared

    - Homepage:
        icon: homepage.png
        href: http://192.168.0.10:3010
        description: This Dashboard (LAN)
        server: my-docker
        container: homepage-lan

    # The public landing page the tunnel serves (/docker/landing): a static nginx site.
    - Landing Page:
        icon: mdi-web
        href: http://192.168.0.10:3000
        description: Public start page
        server: my-docker
        container: landing

    # Who opened the public page: visits per device, visits to the apps, blocklist.
    - Visitors:
        icon: mdi-account-eye-outline
        href: http://192.168.0.10:3011
        description: Who opened the public page
        server: my-docker
        container: landing-visitors

    # ntfy (/docker/ntfy): phone push alerts from core7x and the apps. LAN and
    # Tailscale only, never routed through the tunnel.
    - ntfy:
        icon: ntfy.png
        href: http://192.168.0.10:8094
        description: Phone Alerts
        server: my-docker
        container: ntfy
        siteMonitor: http://192.168.0.10:8094/v1/health

- Monitoring:
    - Grafana:
        icon: grafana.png
        href: http://192.168.0.10:3001/d/7xlab/my-lab
        description: Dashboards
        server: my-docker
        container: grafana

    - Prometheus:
        icon: prometheus.png
        href: http://192.168.0.10:9090
        description: Metrics Store
        server: my-docker
        container: prometheus

    - cAdvisor:
        icon: cadvisor.png
        href: http://192.168.0.10:8082
        description: Container Metrics
        server: my-docker
        container: cadvisor

    - Scrutiny:
        icon: scrutiny.png
        href: http://192.168.0.10:8083
        description: Disk S.M.A.R.T. Health
        server: my-docker
        container: scrutiny

    - SMART Exporter:
        icon: mdi-harddisk
        href: http://192.168.0.10:9633/metrics
        description: Disk Metrics
        server: my-docker
        container: smartctl-exporter

- Finance:
    - Firefly III:
        icon: firefly-iii.png
        href: http://192.168.0.10:3002
        description: Household Ledger
        server: my-docker
        container: firefly
        siteMonitor: http://192.168.0.10:3002

    - Finance Dashboard:
        icon: grafana.png
        href: http://192.168.0.10:3001/d/finance/finance
        description: Spending & Balances

    - Ask My Finances:
        icon: mdi-chat-question-outline
        href: http://192.168.0.10:8085
        description: Plain-language questions, read-only
        siteMonitor: http://192.168.0.10:8085

    - Categorise Payments:
        icon: mdi-tag-multiple-outline
        href: http://192.168.0.10:8085/categorise
        description: Filter by dates, set categories in bulk

    - Bank Mail Importer:
        icon: mdi-email-sync-outline
        description: Reads Bank Mail Every 15 Min
        server: my-docker
        container: finance-ingest

    # IPO Desk (/docker/ipodesk): paper trading in recent IPO listings with Rs 1
    # lakh of pretend money; an AI decides and keeps a playbook of its lessons.
    - IPO Desk:
        icon: mdi-chart-line
        href: http://192.168.0.10:8091
        siteMonitor: http://192.168.0.10:8091/api/ping
        description: Paper Trading in New Listings
        server: my-docker
        container: ipodesk

- AI:
    # core7x (/docker/lab-ai/portal): lead of the AI team and its portal. Sessions
    # on any model from the phone, plan limits, cleanup and growth reviews. A host
    # process, not a container, so only the site monitor shows its state.
    - core7x:
        icon: /images/core7x.svg
        href: http://192.168.0.10:8093
        description: AI Sessions, Limits & Reviews
        siteMonitor: http://192.168.0.10:8093/api/me

- Health:
    # Gym (/docker/gym): workout program, set logger, progress charts and the
    # watch's data. Its summary only changes when a workout is logged, so a
    # 5-minute refresh (the unit is ms) is plenty. Offline/install as an app
    # needs HTTPS, which only the tunnel hostname has.
    - Gym:
        icon: mdi-dumbbell
        href: http://192.168.0.10:8086
        siteMonitor: http://192.168.0.10:8086/api/ping
        description: Workouts, Progress & Watch Data
        server: my-docker
        container: gym
        widget:
          type: customapi
          url: http://192.168.0.10:8086/api/summary
          refreshInterval: 300000
          mappings:
            - field: week_done
              label: Days This Week
              format: number
            - field: streak_weeks
              label: Week Streak
              format: number

- Garden:
    # Plants (/docker/plants): photo inventory, per-plant care guide and the
    # weather-driven watering log. The "needs water" count is worked out in the
    # browser from the log, so there is no summary widget here.
    - Plants:
        icon: mdi-sprout
        href: http://192.168.0.10:8087
        description: Watering & Care Guide
        server: my-docker
        container: plants
        siteMonitor: http://192.168.0.10:8087/api/ping

- Documents:
    # Resume (/docker/resume): resume editor for everyone at home, many
    # templates, PDF download. No logins.
    - Resume:
        icon: mdi-file-account
        href: http://192.168.0.10:8088
        description: Resume Builder
        server: my-docker
        container: resume
        siteMonitor: http://192.168.0.10:8088/api/ping

- Archive:
    # oldbackup (/data/oldbackup): old downloads, browsed and played by simpleparty.
    - oldbackup:
        icon: mdi-archive
        href: http://192.168.0.10:1312
        description: Old Downloads Browser
        server: my-docker
        container: simpleparty
        siteMonitor: http://192.168.0.10:1312
