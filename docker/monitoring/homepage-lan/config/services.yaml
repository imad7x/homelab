- Health:
    # Gym (/docker/gym): workout program, set logger, progress charts and the
    # watch's data. Its summary only changes when a workout is logged, so a
    # 5-minute refresh (the unit is ms) is plenty. Offline/install as an app
    # needs HTTPS, which only the tunnel hostname has.
    - Gym:
        icon: mdi-dumbbell
        href: http://192.168.0.10:8086
        siteMonitor: http://192.168.0.10:8086/api/ping
        description: Workouts, Progress & Watch Data
        server: my-docker
        container: gym
        widget:
          type: customapi
          url: http://192.168.0.10:8086/api/summary
          refreshInterval: 300000
          mappings:
            - field: week_done
              label: Days This Week
              format: number
            - field: streak_weeks
              label: Week Streak
              format: number

- Documents:
    - Paperless:
        icon: paperless-ngx.png
        href: http://192.168.0.10:8000
        description: OCR Document Archive
        server: my-docker
        container: paperless
        siteMonitor: http://192.168.0.10:8000
        # For the doc-count widget, create a token in Paperless
        # (top-right menu -> My Profile -> API Auth Token) and add:
        #   widget:
        #     type: paperlessngx
        #     url: http://192.168.0.10:8000
        #     key: <token>

    - Paperless DB:
        icon: postgres.png
        description: Document Index
        server: my-docker
        container: paperless-db
