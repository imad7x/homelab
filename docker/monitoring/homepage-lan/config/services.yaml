---
# LAN start page (homepage-lan, :3010). Every link is a 192.168.0.10 address; nothing here goes
# through the tunnel. Tiles with server/container show a live dot and CPU/RAM (docker.yaml).
# Cleaned up 2026-11-21: Home Assistant, Prometheus and simpleparty gone; Bookshelf, 7xjobs added.
# Downloaders run on demand (core7x Server > Health > On demand, 2 h idle stop), so their API
# widgets were dropped: they showed errors whenever the containers were stopped.

- Media:
    - Jellyfin:
        icon: jellyfin.png
        href: http://192.168.0.10:8096
        description: Media Server
        server: my-docker
        container: jellyfin
        siteMonitor: http://192.168.0.10:8096
        # Widget off: Jellyfin 12 dropped the /emby/ route homepage still calls (no upstream fix yet).
    - Jellyseerr:
        icon: jellyseerr.png
        href: http://192.168.0.10:5055
        description: Requests (approving one starts the downloaders)
        server: my-docker
        container: jellyseerr
    - Jellystat:
        icon: jellystat.png
        href: http://192.168.0.10:3003
        description: Watch History & Stats
        server: my-docker
        container: jellystat
    - Movies:
        icon: mdi-movie-open-star-outline
        href: http://192.168.0.10:8089
        description: What to Watch Next
        server: my-docker
        container: movies
        siteMonitor: http://192.168.0.10:8089/api/ping
    - Navidrome:
        icon: navidrome.png
        href: http://192.168.0.10:4533
        description: Music Server
        server: my-docker
        container: navidrome
        widget:
          type: navidrome
          url: http://192.168.0.10:4533
          user: imad7x
          salt: [[secret:HOMEPAGE_SALT]]
          token: [[secret:HOMEPAGE_TOKEN]]
    - Bookshelf:
        icon: readarr.png
        href: http://192.168.0.10:8787
        description: Books (Readarr fork), always on
        server: my-docker
        container: bookshelf
        siteMonitor: http://192.168.0.10:8787

