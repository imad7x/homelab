global:
  scrape_interval: 15s

# Recording rules (homelab-power.yml: per-component watts for the My Lab dashboard).
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    scrape_interval: 10s
    static_configs:
      - targets: ['192.168.0.10:9100']
        labels:
          instance: 'lab'

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Disk S.M.A.R.T. health. The exporter re-reads the disks every 300s, so there is
  # no point scraping it at the global 15s interval.
  - job_name: 'smartctl-exporter'
    scrape_interval: 60s
    static_configs:
      - targets: ['smartctl-exporter:9633']
        labels:
          instance: 'lab'
