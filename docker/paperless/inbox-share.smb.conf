# Optional: a dedicated Samba share for the Paperless drop folder.
#
# Without this, the inbox is reachable as  \\lab7x\lab7x\inbox
# With it, it is also reachable as         \\lab7x\inbox
#
# The second form shows up as its own entry when you browse the server, so
# there is no folder to open first - map it as a drive and dragging a file
# onto that drive is the whole workflow.
#
# Apply with:
#   sudo tee -a /etc/samba/smb.conf < /docker/paperless/inbox-share.smb.conf
#   sudo testparm -s          # sanity check, should report "Loaded services file OK"
#   sudo systemctl reload smbd

[inbox]
   comment = Paperless drop folder - anything copied here gets OCR'd and archived
   path = /data/inbox
   browseable = yes
   read only = no
   guest ok = no
   valid users = imad7x
   create mask = 0644
   directory mask = 0755
