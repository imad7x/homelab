# IPO Desk: a paper trading account (Rs 1,00,000 of pretend money) that only
# deals in companies listed through a mainboard IPO in the last two years and
# in IPOs that are open for bids. Decisions come from an AI run on this host
# (/docker/ipodesk/ai, on the subscription) that reads news, fundamentals and
# technicals, and learns from its own results: a post-mortem after every closed
# trade and a weekly review that rewrites its playbook.
#
#   on the LAN:  http://192.168.0.10:8091
#   log:         docker logs ipodesk
#
# Market data comes from NSE's public website (IPO lists and subscription,
# quotes, daily prices, filings), headlines from Bing News / ET / Mint RSS and
# fundamentals from Screener. No broker account is involved. Everything lives
# in ./state/ipodesk.db (SQLite).

services:
  ipodesk:
    build: .
    image: ipodesk:latest
    container_name: ipodesk
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "8091:8091"
    environment:
      - TZ=Asia/Kolkata
      # Names (besides IPs and localhost) the page may be opened under.
      - ALLOWED_HOSTS=
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - ./state:/state
      # The code is mounted read-only so an edit takes effect on the next
      # restart, like gym and movies.
      - ./app:/app:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/api/ping', timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3
