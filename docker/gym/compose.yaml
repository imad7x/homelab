# Gym: the workout program with exercise guides, a set logger that suggests
# the next weight, progress charts, body measurements, and the Huawei watch's
# data (steps, sleep, heart rate) received from the phone.
#
#   on the LAN:  http://192.168.0.10:8086
#   at the gym:  https://gym.[[private:DOMAIN]] once the tunnel has a public hostname
#                for it, behind Cloudflare Access like finance
#   log:         docker logs gym
#
# The page works offline on the phone and syncs here when it can. Everything
# lives in ./state/gym.db (SQLite).

services:
  gym:
    build: .
    image: gym:latest
    container_name: gym
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "8086:8086"
    environment:
      - TZ=Asia/Kolkata
      # Names (besides IPs and localhost) the page may be opened under.
      - ALLOWED_HOSTS=gym.[[private:DOMAIN]]
      # Shown in the watch setup steps as places the phone can post to.
      - INGEST_URLS=http://192.168.0.10:8086/api/health
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - ./state:/state
      # The code is mounted read-only so an edit takes effect on the next
      # restart, like updater and finance-ingest.
      - ./app:/app:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8086/api/ping', timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3
